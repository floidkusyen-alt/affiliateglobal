<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remote Control Bot MT5</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.25);
      --red: #ef4444;
      --red-glow: rgba(239, 68, 68, 0.25);
      --blue: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .status-box {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 16px;
      text-align: center;
      margin-bottom: 20px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 18px;
      background: #334155;
      color: #cbd5e1;
    }

    .badge.on { background: var(--green-glow); color: #34d399; border: 1px solid var(--green); }
    .badge.off { background: var(--red-glow); color: #f87171; border: 1px solid var(--red); }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: currentColor;
    }

    .btn-power {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.2s ease, background 0.2s ease;
    }

    .btn-power:active { transform: scale(0.98); }
    .btn-power:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-power.to-off { background: var(--red); box-shadow: 0 8px 20px var(--red-glow); }
    .btn-power.to-on { background: var(--green); box-shadow: 0 8px 20px var(--green-glow); }

    .meta {
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .note {
      font-size: 0.8rem;
      color: var(--muted);
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .actions-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn-sec {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-sec:hover { background: rgba(255, 255, 255, 0.05); }

    .config {
      border-top: 1px solid var(--border);
      padding-top: 16px;
      display: none;
    }

    .config.open { display: block; }

    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .field input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.85rem;
    }

    .btn-save {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: var(--blue);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .toast {
      margin-top: 12px;
      text-align: center;
      font-size: 0.82rem;
      min-height: 18px;
      color: #93c5fd;
    }
    .toast.err { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Channel Breakout Bot</h1>
      <p>Remote ON / OFF via Cloudflare KV</p>
    </div>

    <div class="status-box">
      <div id="statusBadge" class="badge">
        <span class="dot"></span>
        <span id="statusText">MEMUAT...</span>
      </div>

      <button id="toggleBtn" class="btn-power to-on" disabled>Menghubungkan...</button>

      <div class="meta">
        Update terakhir: <strong id="lastUpdate">-</strong>
      </div>
    </div>

    <div class="note">
      <strong>OFF:</strong> Bot berhenti entry baru di semua pair.<br />
      <strong>ON:</strong> Bot otomatis membuat garis baru &amp; reset catatan loss dalam maks. 1 menit.
    </div>

    <div class="actions-row">
      <button class="btn-sec" id="refreshBtn">Refresh Status</button>
      <button class="btn-sec" id="configBtn">Ubah URL</button>
    </div>

    <div id="configPanel" class="config">
      <div class="field">
        <label for="workerUrl">URL Cloudflare Worker</label>
        <input type="url" id="workerUrl" placeholder="https://bot-kamu.subdomain.workers.dev" />
      </div>
      <button class="btn-save" id="saveConfigBtn">Simpan &amp; Muat Ulang</button>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <script>
    // === GANTI URL WORKER KAMU DI SINI ===
    const DEFAULT_WORKER_URL = "https://nama-worker-kamu.subdomain.workers.dev";

    const statusBadge   = document.getElementById("statusBadge");
    const statusText    = document.getElementById("statusText");
    const toggleBtn     = document.getElementById("toggleBtn");
    const lastUpdateEl  = document.getElementById("lastUpdate");
    const refreshBtn    = document.getElementById("refreshBtn");
    const configBtn     = document.getElementById("configBtn");
    const configPanel   = document.getElementById("configPanel");
    const workerUrlIn   = document.getElementById("workerUrl");
    const saveConfigBtn = document.getElementById("saveConfigBtn");
    const toastEl       = document.getElementById("toast");

    let currentEnabled = null;

    function getWorkerUrl() {
      return (localStorage.getItem("cb_worker_url") || DEFAULT_WORKER_URL).replace(/\/+$/, "");
    }

    function showToast(msg, isError = false) {
      toastEl.textContent = msg;
      toastEl.className = isError ? "toast err" : "toast";
    }

    function renderState(data) {
      currentEnabled = Boolean(data.enabled);
      toggleBtn.disabled = false;

      if (currentEnabled) {
        statusBadge.className = "badge on";
        statusText.textContent = "BOT AKTIF (ON)";
        toggleBtn.className = "btn-power to-off";
        toggleBtn.textContent = "MATIKAN BOT (OFF)";
      } else {
        statusBadge.className = "badge off";
        statusText.textContent = "BOT BERHENTI (OFF)";
        toggleBtn.className = "btn-power to-on";
        toggleBtn.textContent = "HIDUPKAN BOT (ON + GARIS BARU)";
      }

      if (data.updated_at) {
        const dt = new Date(data.updated_at);
        lastUpdateEl.textContent = isNaN(dt) ? data.updated_at : dt.toLocaleString("id-ID");
      }
    }

    async function fetchStatus() {
      const url = getWorkerUrl();
      if (!url || url.includes("nama-worker-kamu")) {
        configPanel.classList.add("open");
        showToast("Masukkan URL Cloudflare Worker kamu dulu.", true);
        return;
      }

      toggleBtn.disabled = true;
      showToast("Mengambil status dari server...");

      try {
        const res = await fetch(`${url}/status`, {
          method: "GET",
          cache: "no-store"
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

        renderState(data);
        showToast("Status tersinkron.");
      } catch (err) {
        showToast("Gagal terhubung: " + err.message, true);
      }
    }

    async function toggleBot() {
      if (currentEnabled === null) return;
      const url = getWorkerUrl();
      const targetState = !currentEnabled;

      toggleBtn.disabled = true;
      showToast(targetState ? "Menghidupkan bot..." : "Mematikan bot...");

      try {
        const res = await fetch(`${url}/toggle`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ enabled: targetState })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

        renderState(data);
        showToast(targetState
          ? "Bot ON! MT5 akan membuat garis baru dalam maks. 1 menit."
          : "Bot OFF! MT5 berhenti membuka entry baru.");
      } catch (err) {
        toggleBtn.disabled = false;
        showToast("Gagal mengubah status: " + err.message, true);
      }
    }

    toggleBtn.addEventListener("click", toggleBot);
    refreshBtn.addEventListener("click", fetchStatus);
    configBtn.addEventListener("click", () => configPanel.classList.toggle("open"));
    saveConfigBtn.addEventListener("click", () => {
      localStorage.setItem("cb_worker_url", workerUrlIn.value.trim().replace(/\/+$/, ""));
      configPanel.classList.remove("open");
      fetchStatus();
    });

    workerUrlIn.value = getWorkerUrl();
    fetchStatus();
  </script>
</body>
</html>
